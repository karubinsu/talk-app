<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Common — Connect Beyond Language</title>
<style>
  :root{
    --bg:#14141f; --bg-soft:#1c1c2c; --card:#232338; --card-hi:#2b2b44;
    --accent:#ff8b5e; --accent-2:#f2c14e; --text:#f5f1ea; --text-muted:#a8a4b8;
    --border: rgba(245,241,234,0.08);
    --serif: 'Iowan Old Style','Palatino Linotype','Book Antiqua', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 20% 0%, rgba(255,139,94,0.14), transparent 55%),
      radial-gradient(circle at 90% 100%, rgba(242,193,78,0.10), transparent 50%),
      var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100dvh;
    display:flex; align-items:stretch; justify-content:center;
  }
  .app{
      width:100%; height:100dvh; background:var(--bg-soft);
      padding: max(28px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
      position:relative; display:flex; flex-direction:column; overflow-y:auto;
  }
  @media (min-width: 560px){
    body{ padding:20px; align-items:center; }
    .app{
      max-width:440px; height:640px; max-height:92dvh; border-radius:28px; border:1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45); padding:28px 22px 22px; margin:auto; overflow-y:auto;
    }
  }
  .mark{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;}
  .mark-left{display:flex;align-items:center;gap:10px;}
  .mark svg{width:26px;height:26px;flex-shrink:0;}
  .mark span.label{font-family:var(--serif);font-size:15px;letter-spacing:0.02em;color:var(--text-muted);}
  .back-btn{cursor:pointer;font-size:19px;color:var(--text-muted);line-height:1;padding:2px 2px 2px 0;}
  .start-over{font-size:11px;color:var(--text-muted);cursor:pointer;text-decoration:underline;white-space:nowrap;}
  h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.25;margin:0 0 8px;}
  .sub{color:var(--text-muted);font-size:14.5px;line-height:1.5;margin:0 0 16px;}
  .screen{flex:1;display:flex;flex-direction:column;}
  .grow{flex:1;}
  .lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .lang-btn{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;color:var(--text);transition:border-color .15s, background .15s;}
  .lang-btn:hover{border-color:rgba(255,139,94,0.4);}
  .lang-btn.selected{background:linear-gradient(135deg, rgba(255,139,94,0.18), rgba(242,193,78,0.10));border-color:var(--accent);}
  .lang-native{font-family:var(--serif);font-size:19px;display:block;}
  .lang-eng{font-size:12px;color:var(--text-muted);display:block;margin-top:2px;}
  .lang-btn.more-btn{position:relative;padding-right:26px;}
  .more-indicator{position:absolute;right:4px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center;font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);opacity:0.75;white-space:nowrap;}
  .modal-overlay.more-modal{padding:14px;}
  .more-modal .modal-card{max-width:440px;padding:20px 16px;max-height:80vh;overflow-y:auto;}
  .more-modal .lang-grid{margin-top:4px;}
  .more-modal-title{font-family:var(--serif);font-size:18px;margin:0 0 14px;}
  label.field-label{font-size:13px;color:var(--text-muted);display:block;margin:18px 0 8px;}
  select, input[type=text], textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:var(--sans);font-size:15.5px;padding:14px;outline:none;}
  select:focus, input:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:90px;}
  .hint{font-size:12px;color:var(--text-muted);margin:7px 2px 0;line-height:1.4;}
  .btn{display:block;width:100%;text-align:center;border:none;border-radius:16px;padding:15px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#1a1410;margin-top:20px;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);margin-top:10px;}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;color:var(--text-muted);font-size:14px;}
  .pulse{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg, var(--accent), var(--accent-2));animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(0.85);opacity:0.7;}50%{transform:scale(1);opacity:1;}}
  .turn-toggle{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;border:1px solid var(--border);}
  .turn-btn{flex:1;text-align:center;padding:10px 6px;border-radius:11px;cursor:pointer;font-size:13.5px;color:var(--text-muted);}
  .turn-btn.active{background:var(--card-hi);color:var(--text);font-weight:600;}
  .messages{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 14px;}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.45;position:relative;}
  .msg.guest{align-self:flex-end;background:linear-gradient(135deg, rgba(255,139,94,0.22), rgba(242,193,78,0.14));border-bottom-right-radius:4px;}
  .msg.host{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px;}
  .msg .orig{font-size:12px;color:var(--text-muted);margin-top:5px;}
  .msg.has-tip{cursor:pointer;}
  .msg.has-tip.tip-open .tip-marker{opacity:0;}
  .tip-marker{position:absolute;bottom:5px;font-size:10px;line-height:1;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.35));}
  .msg.host .tip-marker{right:6px;}
  .msg.guest .tip-marker{left:6px;}
  .msg-tip{width:0;max-height:0;opacity:0;overflow:hidden;font-size:12.5px;line-height:1.42;color:var(--text-muted);background:rgba(0,0,0,0.16);border-radius:10px;padding:0 10px;margin-top:0;transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease, padding .25s ease;}
  .msg-tip.show{width:100%;max-height:160px;opacity:1;padding:8px 10px;margin-top:8px;}
  .msg.error{border:1px solid rgba(255,120,120,0.45);cursor:pointer;}
  .error-text{font-size:13px;color:#ff9a9a;display:flex;align-items:center;gap:6px;}
  .translating{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--text-muted);animation:blink 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
  .chat-input-wrap{position:relative;}
  .chat-input-wrap textarea{min-height:50px;max-height:110px;padding-right:52px;}
  .send-btn{position:absolute;right:6px;bottom:6px;background:var(--accent);border:none;border-radius:50%;width:36px;height:36px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .send-btn svg{width:19px;height:19px;}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .dev-hint{font-size:11px;color:var(--text-muted);margin:4px 2px 0;line-height:1.3;text-align:center;}
  .keyboard-setup-banner{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--text-muted);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:12px 0 0;line-height:1.4;}
  .end-link{text-align:center;font-size:13px;color:var(--text-muted);margin-top:10px;cursor:pointer;text-decoration:underline;}
  .thanks-icon{font-size:38px;margin-bottom:6px;}
  .feature-list{margin:4px 0 14px;padding-left:20px;}
  .feature-list li{margin-bottom:6px;font-size:14px;color:var(--text-muted);line-height:1.4;}
  .banner{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:14px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
  .modal-card{background:var(--card-hi);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:320px;width:100%;}
  .modal-card p{margin:0 0 18px;font-size:15px;line-height:1.5;color:var(--text);}
  .modal-row{display:flex;gap:10px;}
  .modal-row button{flex:1;padding:12px;border-radius:12px;font-family:var(--sans);font-size:14.5px;cursor:pointer;}
  .modal-cancel{border:1px solid var(--border);background:transparent;color:var(--text-muted);}
  .modal-confirm{border:none;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#1a1410;font-weight:600;}
  .dev-modal .modal-card{max-width:360px;max-height:82vh;overflow-y:auto;}
  .dev-section{margin-top:16px;}
  .dev-section:first-of-type{margin-top:0;}
  .dev-msg-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
  .dev-msg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .dev-msg-info{display:flex;flex-direction:column;min-width:0;}
  .dev-msg-sender{font-size:11px;color:var(--accent);font-weight:600;}
  .dev-msg-text{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
  .dev-msg-actions{display:flex;gap:6px;flex-shrink:0;}
  .dev-msg-actions button{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;}
  .dev-msg-actions button:hover{border-color:var(--accent);color:var(--text);}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>

let HOST_NAME = (function(){
  try{ return localStorage.getItem(HOST_NAME_STORAGE_KEY) || "Vince"; }catch(e){ return "Vince"; }

  HOST_NAME = (name && name.trim()) || "Vince";
  try{ localStorage.setItem(HOST_NAME_STORAGE_KEY, HOST_NAME); }catch(e){}

  ]},
  { code:'id', label:'Indonesian', native:'Bahasa Indonesia', dialects:[
      {en:'Standard Indonesian', native:'Bahasa Indonesia Baku'},
  ]},
];
const ALL_LANGUAGES = LANGUAGES.concat(MORE_LANGUAGES);
function isMoreLanguage(code){ return MORE_LANGUAGES.some(l => l.code === code); }
function findAnyLanguage(code){ return ALL_LANGUAGES.find(l => l.code === code); }

// Best-effort hint only. iOS/Android web pages cannot force-switch the visible
// keyboard layout the way native apps (like Duolingo) do via native APIs, this
// is a real web-platform limitation, not a bug in this app. The lang attribute
// mainly helps autocorrect/spellcheck pick the right dictionary, not the layout.
const KEYBOARD_LANG_TAG = { ja:'ja', ko:'ko', vi:'vi', tl:'fil', th:'th', es:'es', ms:'ms', my:'my', id:'id' };
const HI_DIALECT_TAG = { 'Punjabi':'pa', 'Bengali':'bn', 'Tamil':'ta', 'Telugu':'te', 'Marathi':'mr', 'Gujarati':'gu' };
function keyboardLangTag(){
  if(!state.lang || state.lang.code === 'other') return '';
  if(state.lang.code === 'zh'){
    const d = state.dialect || '';
    return (d.includes('Taiwanese') || d.includes('Cantonese')) ? 'zh-Hant' : 'zh-Hans';
  }
  if(state.lang.code === 'hi'){
    return HI_DIALECT_TAG[state.dialect] || 'hi';
  }
  return KEYBOARD_LANG_TAG[state.lang.code] || '';
}

// Transient (not persisted) tracking of which message's tip is currently
// expanded, its auto-dismiss timer, and which tips have already been opened
// once this session (first open = 5s auto-dismiss, reopening = 10s).
let activeTipId = null;
let tipTimeoutHandle = null;
const openedTipIds = new Set();

function closeActiveTip(){
  clearTimeout(tipTimeoutHandle);
  if(activeTipId){
    const bubble = document.querySelector(`.msg[data-id="${activeTipId}"]`);
    const el = bubble ? bubble.querySelector('.msg-tip') : null;
    if(el){
      el.style.transition = 'none';
      el.classList.remove('show');
      void el.offsetHeight; // force reflow so the transition:none actually applies
      el.style.transition = '';
    }
    if(bubble) bubble.classList.remove('tip-open');
  }
  activeTipId = null;
}

// Opens a tip's DOM node directly (no render()) so the CSS transition on
// .msg-tip has an actual "before" state to animate from, and schedules its
// auto-dismiss: 5s the first time a given message's tip is opened, 10s on
// every subsequent reopen. Manual dismiss (tapping again) always works
// regardless of the timer, via closeActiveTip()/toggleTip() below.
function openTip(id){
  clearTimeout(tipTimeoutHandle);
  activeTipId = id;
  const bubble = document.querySelector(`.msg[data-id="${id}"]`);
  const el = bubble ? bubble.querySelector('.msg-tip') : null;
  if(el) el.classList.add('show');
  if(bubble) bubble.classList.add('tip-open');
  const duration = openedTipIds.has(id) ? 10000 : 5000;
  openedTipIds.add(id);
  tipTimeoutHandle = setTimeout(closeActiveTip, duration);
}

function toggleTip(id){
  if(activeTipId === id){ closeActiveTip(); return; }
  if(activeTipId){
    const prevBubble = document.querySelector(`.msg[data-id="${activeTipId}"]`);
    const prevEl = prevBubble ? prevBubble.querySelector('.msg-tip') : null;
    if(prevEl){
      prevEl.style.transition = 'none';
      prevEl.classList.remove('show');
      void prevEl.offsetHeight;
      prevEl.style.transition = '';
    }
    if(prevBubble) prevBubble.classList.remove('tip-open');
  }
  openTip(id);
}

(function restore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && saved.screen && !saved.screen.startsWith('loading')){
        state = saved;
        if(!state.history) state.history = [];
        if(state.messages){
          state.messages.forEach(m => {
            if(m.status === 'pending') m.status = 'error';
            const n = parseInt((m.id||'m0').slice(1)) || 0;
            if(n > msgIdCounter) msgIdCounter = n;
          });
        }
        if(state.screen === 'thanks' && state.feedbackPending){
          state.feedbackPending = false;
          if(!state.feedbackTranslatedToEnglish) state.feedbackTranslatedToEnglish = state.feedbackText || '(no feedback entered)';
        }
      }
    }
  }catch(e){}
})();

/* ============ AI API CALL (Gemini + Groq, with dev-selectable provider) ============ */
const PROVIDER_STORAGE_KEY = "talk_provider_choice_v1";
const PROVIDER_OPTIONS = [
  { value: 'auto',                      label: 'Auto (Smart Fallback)' },
  { value: 'gemini-3.6-flash',          label: 'Gemini 3.6 Flash' },
  { value: 'gemini-3.5-flash-lite',     label: 'Gemini 3.5 Flash-Lite' },
  { value: 'gemini-3.5-flash',          label: 'Gemini 3.5 Flash' },
  { value: 'llama-3.3-70b-versatile',   label: 'Groq Llama 3.3 70B Versatile' },
  { value: 'llama-3.1-8b-instant',      label: 'Groq Llama 3.1 8B Instant' },
];

function getProviderChoice(){
  try{ return localStorage.getItem(PROVIDER_STORAGE_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
function setProviderChoice(value){
  try{ localStorage.setItem(PROVIDER_STORAGE_KEY, value); }catch(e){}
}

async function callAI(system, userText) {
  const provider = getProviderChoice();
  const res = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, userText, provider })
  });

  if (!res.ok) {
    const errObj = await res.json().catch(() => ({}));
    throw new Error(errObj.error || "API error " + res.status);
  }

  const data = await res.json();
  if (!data.text) throw new Error("Empty response");
  // data.usedModel tells us which model actually answered (useful for debugging/dev drawer)
  return data.text;
}

function langName(){
  return state.lang.code === 'other' ? state.customLang : state.lang.label;
}

async function translateUIStrings(){
  const system = `You translate short UI strings for a casual, friendly conversation-translator app into ${langName()}. Write the way real bilingual native speakers actually talk day-to-day, natural code-switching with English is fine if that is genuinely how people commonly speak this language, but lean more on ${langName()} than English overall. Avoid stiff, textbook, or overly formal phrasing, it should read like a text from a friend. Never use em dashes, use commas, periods, or parentheses instead. Do not reference "tonight" or any single specific event, keep the wording generally applicable over time. Some values are arrays of short bullet phrases, translate every element and keep the same array structure. Return ONLY a valid JSON object with exactly the same keys as given. No markdown fences, no commentary, nothing else.`;
  const userText = JSON.stringify(STATIC_UI.en.base);
 // Replace: const raw = await callClaude(system, userText);
const raw = await callAI(system, userText);
  const cleaned = raw.replace(/^```json\s*/,'').replace(/```$/,'').trim();
  try{ return JSON.parse(cleaned); }
  catch(e){ console.error("UI translation parse failed, falling back to English", e, raw); return STATIC_UI.en.base; }
}

function getDialectHint(){
  if(state.lang && state.lang.code !== 'other' && STATIC_UI[state.lang.code]) return STATIC_UI[state.lang.code].base.dialectHint;
  return STATIC_UI.en.base.dialectHint;
}

async function getUIStrings(){
  if(state.lang.code !== 'other' && STATIC_UI[state.lang.code]){
    const entry = STATIC_UI[state.lang.code];
    const overrides = (entry.dialects && entry.dialects[state.dialect]) || {};
    return Object.assign({}, entry.base, overrides); // zero LLM calls
  }
  const key = UI_CACHE_PREFIX + (state.customLang||'');
  try{ const cached = localStorage.getItem(key); if(cached) return JSON.parse(cached); }catch(e){}
  const result = await translateUIStrings();
  try{ localStorage.setItem(key, JSON.stringify(result)); }catch(e){}
  return result;
}

async function translateMessage(text, direction){
  const dialectPart = state.dialect ? ` (${state.dialect} dialect/register)` : '';
  const guestLabel = state.name || 'Guest';
  const historyLines = state.messages
    .filter(m => m.status === 'done')
    .map(m => {
      const speaker = m.sender === 'host' ? HOST_NAME : guestLabel;
      const spokenLang = m.sender === 'host' ? 'English' : `${langName()}${dialectPart}`;
      return `${speaker} said (in ${spokenLang}): "${m.original}"\n  -> shown to the other person as: "${m.translated}"`;
    }).join('\n');

  const system = `You are a live interpreter helping two people who don't share a language have a natural, in-person conversation, not a formal document translator.

Your top priority: produce the translation a native speaker would actually SAY out loud in this situation, never a literal, word-for-word, or "calque" translation that just mirrors the source phrase's structure or vocabulary. Before you finalize any translation, silently check yourself: "Is this exactly how a native speaker of the target language would naturally phrase this idea, or does it just mirror the source wording?" If it's the latter, rephrase it into what a native speaker would actually say, even if that means restructuring the sentence completely or using a wholly different phrase to express the same idea.

Example of the pattern to avoid: a Tagalog speaker asks "Pang-ilan ka sa magkakapatid?" (literally close to "what number child are you among siblings"). A word-for-word English rendering like "What number child are you in your family?" is NOT something a native English speaker would say, it just mirrors the Tagalog structure. A native speaker would instead ask something like "Where do you fall in the birth order?" or "What number are you among your siblings?" or "Are you the oldest, youngest, or somewhere in between?". Apply this same standard of judgment to every language pair and every message, not just this example.

Avoid stiff or textbook phrasing, and never use em dashes, use commas, periods, or parentheses instead.

You'll be given the full conversation so far, including, for each earlier turn, both what the speaker actually said in their own words and the natural rendering that was actually shown to the other person. Use this so your new translation stays consistent with what the other person actually saw and responded to:
- If the message you're translating now is a reply to an earlier message that was rephrased for naturalness, translate this reply so that, once translated, it reads as a coherent, directly-connected answer to the ORIGINAL question or statement the first person actually made in their own language, not to the rephrased version. The person who asked the original question should feel like they got a direct answer to what they actually asked.
- Only adjust what's necessary for that connection to read naturally, never invent facts or change the substance of what the person actually said.

Respond with ONLY a valid JSON object shaped exactly like {"translated": "...", "note_en": null, "note_local": null}, no markdown fences, no commentary outside the JSON. Set BOTH "note_en" (written naturally in English) and "note_local" (written naturally in ${langName()}${dialectPart}, not translated word-for-word from the English one) to the same short, casual explanation whenever either of these is true:
1. Your natural translation meaningfully departs from a literal, word-for-word reading of the source. Briefly say what the literal version would've sounded like and why you rephrased it.
2. This message is a reply that only fully makes sense because of an earlier rephrasing. Briefly explain that connection, e.g. that this reply is answering the earlier rephrased question, so the other person understands why the reply lines up with what they originally asked.
Leave "note_en" and "note_local" as null together only when the translation is a normal direct match to the source AND isn't affected by any earlier rephrasing. Most messages should still have null notes, only flag when it's genuinely useful context. Never fill in one and leave the other null, both are always present together or both null.`;

  const instruction = direction === 'toEnglish'
    ? `Full conversation so far:\n${historyLines || '(this is the first message)'}\n\nNow translate this new message from ${langName()}${dialectPart} into natural, casual English:\n\n"${text}"`
    : `Full conversation so far:\n${historyLines || '(this is the first message)'}\n\nNow translate this new message from natural, casual English into natural, casual ${langName()}${dialectPart}:\n\n"${text}"`;

  // Replace: const raw = await callClaude(system, instruction);
  const raw = await callAI(system, instruction);
  const cleaned = raw.replace(/^```json\s*/,'').replace(/```$/,'').trim();
  try{
    const parsed = JSON.parse(cleaned);
    if(parsed && typeof parsed.translated === 'string'){
      return { translated: parsed.translated, noteEn: parsed.note_en || null, noteLocal: parsed.note_local || null };
    }
    throw new Error('unexpected shape');
  }catch(e){
    // Fallback for a non-JSON reply: use it as the translation with no notes.
    return { translated: raw.trim(), noteEn: null, noteLocal: null };
  }
}

  });

  overlay.querySelectorAll('.dev-msg-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      state.messages = state.messages.filter(m => m.id !== id);
      overlay.remove();
      render();
    });
  });

  overlay.querySelectorAll('.dev-msg-switch').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const m = state.messages.find(x => x.id === id);
      if(!m) return;
      m.sender = m.sender === 'host' ? 'guest' : 'host';
      m.translated = null;
      m.noteEn = null;
      m.noteLocal = null;
      m.status = 'pending';
      overlay.remove();
      render();
      const direction = m.sender === 'guest' ? 'toEnglish' : 'fromEnglish';
      doTranslate(id, m.original, direction); // regenerates translation + tip for the new sender
    });
  });

  document.getElementById('devClose').addEventListener('click', () => overlay.remove());
}

/* ============ SCREENS ============ */
function renderLanguageScreen(){
  const items = LANGUAGES.map(l => `
    <div class="lang-btn" data-code="${l.code}">
      <span class="lang-native">${l.native}</span>
      <span class="lang-eng">${l.label}</span>
    </div>
  `).join('');

  const moreSelected = state.lang && isMoreLanguage(state.lang.code);
  const moreBtnNative = moreSelected ? state.lang.native : 'More languages';
  const moreBtnEng = moreSelected ? state.lang.label : 'Tap to see more';

  const dialectOptions = state.lang && state.lang.code !== 'other'
    ? state.lang.dialects.map(d => `<option value="${d.en}" ${state.dialect===d.en?'selected':''}>${d.native} — ${d.en}</option>`).join('')
    : '';

  app.innerHTML = `
    ${markHeader()}
    <h1>Pick your language</h1>
    <p class="sub">This helps us get the tone and dialect right for you.</p>
    <div class="lang-grid">
      ${items}
      <div class="lang-btn more-btn" id="moreLangBtn">
        <span class="lang-native">${moreBtnNative}</span>
        <span class="lang-eng">${moreBtnEng}</span>
        ${moreSelected ? `<span class="more-indicator">More</span>` : ''}
      </div>
      <div class="lang-btn other" data-code="other">
        <span class="lang-native">Other</span>
        <span class="lang-eng">Type it in</span>
      </div>
    </div>
    ${state.lang && state.lang.code === 'other' ? `
      <label class="field-label">Type your language</label>
      <input type="text" id="customLangInput" placeholder="e.g. Bahasa Indonesia" value="${state.customLang}">
    ` : ''}
    ${state.lang ? `
      <label class="field-label">Dialect / regional style (optional)</label>
      ${state.lang.code === 'other'
        ? `<input type="text" id="customDialectInput" placeholder="Optional — e.g. a specific region" value="${state.dialect || ''}">`
        : `<select id="dialectSelect">${dialectOptions}</select>`
      }
      <p class="hint">${getDialectHint()}</p>
    ` : ''}
    <button class="btn btn-primary" id="continueBtn" ${!canContinueLang() ? 'disabled' : ''}>Continue</button>
  `;

  document.querySelectorAll('.lang-grid .lang-btn').forEach(el => {
    el.classList.toggle('selected', state.lang && state.lang.code === el.dataset.code);
  });
  if(moreSelected){ document.getElementById('moreLangBtn').classList.add('selected'); }

  document.querySelectorAll('.lang-grid .lang-btn:not(.more-btn)').forEach(el => {
    el.addEventListener('click', () => {
      const code = el.dataset.code;
      if(code === 'other'){ state.lang = {code:'other', label:'Other', dialects:[]}; state.dialect = ''; }
      else { state.lang = LANGUAGES.find(l=>l.code===code); state.dialect = state.lang.dialects[0].en; }
      render();
    });
  });
  document.getElementById('moreLangBtn').addEventListener('click', showMoreLanguagesModal);

  const customInput = document.getElementById('customLangInput');
  if(customInput) customInput.addEventListener('input', e => { state.customLang = e.target.value; refreshContinueBtn(); });
  const dialectSelect = document.getElementById('dialectSelect');
  if(dialectSelect) dialectSelect.addEventListener('change', e => { state.dialect = e.target.value; });
  const customDialect = document.getElementById('customDialectInput');
  if(customDialect) customDialect.addEventListener('input', e => { state.dialect = e.target.value; });

  document.getElementById('continueBtn').addEventListener('click', async () => {
    state.screen = 'loadingConsent';
    render();
    state.ui = await getUIStrings();
    state.history.push('language');
    state.screen = 'consent';
    render();
  });
}
function canContinueLang(){
  if(!state.lang) return false;
  if(state.lang.code === 'other') return state.customLang.trim().length > 0;
  return true;
}
function refreshContinueBtn(){ const btn = document.getElementById('continueBtn'); if(btn) btn.disabled = !canContinueLang(); }

function renderLoading(msg){
  app.innerHTML = `${markHeader()}<div class="loading"><div class="pulse"></div><div>${msg}</div></div>`;
}

function renderConsent(){
  const showKeyboardSetupHint = state.lang && state.lang.nonLatin;
  app.innerHTML = `
    ${markHeader()}
    <div class="screen">
      <h1>${state.ui.consentTitle}</h1>
      <p class="sub">${state.ui.consentBody}</p>
      ${showKeyboardSetupHint ? `<div class="keyboard-setup-banner"><span>⌨️</span><span>${state.ui.keyboardSetupHint}</span></div>` : ''}
      <div class="grow"></div>
      <button class="btn btn-primary" id="yesBtn">${state.ui.yesBtn}</button>
      <button class="btn btn-ghost" id="noBtn">${state.ui.noBtn}</button>
    </div>
  `;
  document.getElementById('yesBtn').addEventListener('click', () => { state.history.push('consent'); state.screen='name'; render(); });
  document.getElementById('noBtn').addEventListener('click', () => { state.history.push('consent'); state.screen='declined'; render(); });
}

function renderDeclined(){
  app.innerHTML = `
    ${markHeader()}
    <div class="screen">
      <h1>${state.ui.declineBody}</h1>
      <div class="grow"></div>
      <button class="btn btn-ghost" id="restartBtn">Back to start</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', resetApp);
}

function renderName(){
  app.innerHTML = `
    ${markHeader()}
    <h1>${state.ui.namePrompt}</h1>
    <input type="text" id="nameInput" placeholder="Name" value="${state.name}">
    <button class="btn btn-primary" id="nameContinueBtn" ${state.name.trim() ? '' : 'disabled'}>${state.ui.nameContinue}</button>
  `;
  const input = document.getElementById('nameInput');
  input.addEventListener('input', e => {
    state.name = e.target.value;
    document.getElementById('nameContinueBtn').disabled = !state.name.trim();
  });
  document.getElementById('nameContinueBtn').addEventListener('click', () => {
    state.history.push('name'); state.screen = 'chat'; render();
  });
}

function bubbleHtml(m){
  if(m.status === 'pending'){
    return `<div class="msg ${m.sender}">
      <div class="translating"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;${state.ui.translatingLabel}</div>
      <div class="orig">${m.original}</div>
    </div>`;
  }
  if(m.status === 'error'){
    return `<div class="msg ${m.sender} error" data-id="${m.id}">
      <div class="error-text">⟳ ${state.ui.retryLabel}</div>
      <div class="orig">${m.original}</div>
    </div>`;
  }
  // Show the tip in whichever language the person currently holding the
  // phone (the active side of the turn toggle) actually reads, regardless
  // of which bubble the tip is attached to.
  const noteText = state.turn === 'guest' ? m.noteLocal : m.noteEn;
  const hasTip = !!noteText;
  return `<div class="msg ${m.sender}${hasTip ? ' has-tip' : ''}${activeTipId===m.id ? ' tip-open' : ''}" data-id="${m.id}">
    <div>${m.translated}</div>
    <div class="orig">${m.original}</div>
    ${hasTip ? `<span class="tip-marker">✨</span><div class="msg-tip${activeTipId===m.id ? ' show' : ''}">💬 ${noteText}</div>` : ''}
  </div>`;
}

async function doTranslate(msgId, text, direction){
  let shouldOpenTip = false;
  try{
    const result = await translateMessage(text, direction);
    const m = state.messages.find(x=>x.id===msgId);
    if(m){ m.translated = result.translated; m.noteEn = result.noteEn; m.noteLocal = result.noteLocal; m.status = 'done'; }
    if(m && (m.noteEn || m.noteLocal)) shouldOpenTip = true;
  }catch(e){
    const m = state.messages.find(x=>x.id===msgId);
    if(m){ m.status = 'error'; }
  }
  render();
  if(shouldOpenTip){
    // Wait a frame so the browser paints the bubble in its closed state
    // first, otherwise the class gets added before any paint happens and
    // the transition has nothing to animate from.
    requestAnimationFrame(() => requestAnimationFrame(() => openTip(msgId)));
  }
}

function renderChat(){
  const guestLabel = state.name || 'Guest';
  const bubbles = state.messages.map(bubbleHtml).join('');
  const kbTag = state.turn === 'guest' ? keyboardLangTag() : 'en';
  const showKbHint = state.turn === 'guest' && state.lang && state.lang.code !== 'other';

  app.innerHTML = `
    ${markHeader()}
    <div class="turn-toggle">
      <div class="turn-btn ${state.turn==='guest'?'active':''}" data-turn="guest">${guestLabel}</div>
      <div class="turn-btn ${state.turn==='host'?'active':''}" data-turn="host">${HOST_NAME}</div>
    </div>
    <div class="messages" id="messages">${bubbles}</div>
    <div class="chat-input-wrap">
      <textarea id="chatInput" ${kbTag ? `lang="${kbTag}"` : ''} placeholder="${state.turn==='guest' ? state.ui.inputPlaceholderGuest : 'Type in English...'}"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="${state.ui.sendBtn}">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="dev-hint">${state.ui.devHint}</p>
    ${showKbHint ? `<p class="hint" style="text-align:center;">${state.ui.keyboardHint}</p>` : ''}
    <div class="end-link" id="endLink">${state.ui.endBtn}</div>
  `;

  document.querySelectorAll('.turn-btn').forEach(el => {
    el.addEventListener('click', () => { state.turn = el.dataset.turn; render(); });
  });

  const msgBox = document.getElementById('messages');
  msgBox.scrollTop = msgBox.scrollHeight;

  document.querySelectorAll('.msg.error').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const m = state.messages.find(x=>x.id===id);
      if(!m) return;
      m.status = 'pending';
      render();
      const direction = m.sender === 'guest' ? 'toEnglish' : 'fromEnglish';
      doTranslate(id, m.original, direction);
    });
  });

  document.querySelectorAll('.msg.has-tip').forEach(el => {
    el.addEventListener('click', () => toggleTip(el.dataset.id));
  });

  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  function send(){
    const text = chatInput.value.trim();
    if(!text) return;
    chatInput.value = '';
    const direction = state.turn === 'guest' ? 'toEnglish' : 'fromEnglish';
    const msgId = 'm' + (++msgIdCounter);
    state.messages.push({ id: msgId, sender: state.turn, original: text, translated: null, status: 'pending' });
    render();
    doTranslate(msgId, text, direction);
  }

  sendBtn.addEventListener('click', send);
  chatInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  document.getElementById('endLink').addEventListener('click', () => {
    state.history.push('chat'); state.screen = 'feedback'; render();
  });
}

function renderFeedback(){
  app.innerHTML = `
    ${markHeader()}
    <h1>${state.ui.feedbackTitle}</h1>
    <p class="sub">${state.ui.feedbackBody}</p>
    <textarea id="feedbackInput" placeholder="${state.ui.feedbackPlaceholder}"></textarea>
    <button class="btn btn-primary" id="feedbackSubmitBtn">${state.ui.feedbackSubmit}</button>
  `;
  document.getElementById('feedbackSubmitBtn').addEventListener('click', () => {
    state.feedbackText = document.getElementById('feedbackInput').value.trim();
    state.feedbackPending = true;
    state.feedbackTranslatedToEnglish = '';
    state.screen = 'thanks';
    render();

    (async () => {
      try{
        state.feedbackTranslatedToEnglish = state.feedbackText
          ? (await translateMessage(state.feedbackText, 'toEnglish')).translated
          : '(no feedback entered)';
      }catch(e){
        state.feedbackTranslatedToEnglish = state.feedbackText || '(no feedback entered)';
      }
      state.feedbackPending = false;
      render();
    })();
  });
}

function buildEmailContent(){
  const line = '-'.repeat(30);
  const guestLabel = state.name || 'Guest';
  const header = `Common conversation summary\n${line}\nTester: ${guestLabel}\nLanguage: ${langName()}${state.dialect ? ' (' + state.dialect + ')' : ''}\n${line}\n`;
  const convo = state.messages
    .filter(m => m.status === 'done')
    .map(m => {
      const who = m.sender === 'host' ? HOST_NAME : guestLabel;
      return `\n${who}\n  ${m.translated}\n  (original: ${m.original})`;
    }).join('\n');
  const feedback = `\n\n${line}\nFeedback from ${guestLabel}\n  ${state.feedbackTranslatedToEnglish || '(pending)'}\n  (original: ${state.feedbackText || '(none)'})\n${line}`;
  return { subject: `Common feedback - ${guestLabel} (${langName()})`, body: header + convo + feedback };
}

async function sendFeedbackEmail(){
  const { subject, body } = buildEmailContent();
  try{
    const res = await fetch('/api/send-feedback', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ subject, body })
    });
    if(!res.ok) throw new Error('API responded ' + res.status);
    return true;
  }catch(e){
    const mailLink = `mailto:${HOST_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailLink;
    return false;
  }
}

function renderThanks(){
  const featuresHtml = (state.ui.thanksFeatures || []).map(f => `<li>${f}</li>`).join('');
  const banner = state.feedbackPending
    ? `<div class="banner"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;${state.ui.preparingNote}</div>`
    : '';

  app.innerHTML = `
    ${markHeader()}
    <div class="screen">
      <div class="thanks-icon">🙏</div>
      <h1>${state.ui.thanksTitle}</h1>
      ${banner}
      <p class="sub">${state.ui.thanksIntro}</p>
      <ul class="feature-list">${featuresHtml}</ul>
      <p class="sub">${state.ui.thanksClosing}</p>
      <div class="grow"></div>
      <button class="btn btn-primary" id="finishBtn" ${state.feedbackPending ? 'disabled' : ''}>${state.ui.finishBtn}</button>
      <p class="hint" id="redirectHint" style="text-align:center;min-height:16px;"></p>
    </div>
  `;

  const btn = document.getElementById('finishBtn');
  const hint = document.getElementById('redirectHint');
  btn.addEventListener('click', async () => {
    if(btn.disabled) return;
    btn.disabled = true;
    btn.textContent = state.ui.sendingLabel;
    await sendFeedbackEmail();
    btn.textContent = state.ui.sentLabel;
    let secondsLeft = 5;
    const tick = () => { hint.textContent = (state.ui.redirectingLabel || '').replace('{n}', secondsLeft); };
    tick();
    const timer = setInterval(() => {
      secondsLeft -= 1;
      if(secondsLeft <= 0){ clearInterval(timer); resetApp(); } else tick();
    }, 1000);
  });
}

function resetApp(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = freshState();
  render();
}

/* ============ ROUTER ============ */
function saveState(){
  if(state.screen.startsWith('loading')) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function render(){
  saveState();
  document.title = 'Common — ' + ((state.ui && state.ui.appTagline) || 'Connect Beyond Language');
  switch(state.screen){
    case 'language': renderLanguageScreen(); break;
    case 'loadingConsent': renderLoading('Getting things ready...'); break;
    case 'consent': renderConsent(); break;
    case 'declined': renderDeclined(); break;
    case 'name': renderName(); break;
    case 'chat': renderChat(); break;
    case 'feedback': renderFeedback(); break;
    case 'thanks': renderThanks(); break;
    default: renderLanguageScreen();
  }
  const soEl = document.getElementById('startOverLink');
  if(soEl) soEl.addEventListener('click', () => {
    showConfirmModal('Start over? This will clear the current conversation.', resetApp);
  });
  const backEl = document.getElementById('backBtn');
  if(backEl) backEl.addEventListener('click', goBack);
  const headerEl = document.querySelector('.mark-left');
  if(headerEl) headerEl.addEventListener('click', handleHeaderTap);
}

render();
</script>
